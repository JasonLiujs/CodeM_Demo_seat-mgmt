name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 任务身份变量：在仓库 Settings → Secrets and variables → Actions → Variables 配置。
# 未配置时回退到从仓库名推导（CodeM_Demo_fps → fps），保证模板开箱即用。
#   TASK_NAME    任务短名（如 fps）——决定子域名、容器名、部署目录、镜像名
#   SITE_DOMAIN  完整域名（如 fps.meegodemo.com）
#   APP_PORT     应用容器内部端口（默认 8080，容器内固定，主机侧不暴露）
env:
  TASK_NAME: ${{ vars.TASK_NAME || github.event.repository.name }}
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN || format('{0}.meegodemo.com', vars.TASK_NAME || github.event.repository.name) }}
  APP_PORT: ${{ vars.APP_PORT || '8080' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node tests
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
        if: hashFiles('package.json') != ''
      - run: npm run build
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''

      - name: Python tests
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: hashFiles('requirements.txt') != ''
      - run: pytest
        if: hashFiles('requirements.txt') != ''

      - name: Docker build check
        run: docker build -t codem-ci-check:${{ github.sha }} .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_DIR: /opt/apps/${{ vars.TASK_NAME || github.event.repository.name }}
      IMAGE_NAME: codem-${{ vars.TASK_NAME || github.event.repository.name }}
      CONTAINER_NAME: codem-${{ vars.TASK_NAME || github.event.repository.name }}-app
    steps:
      - uses: actions/checkout@v4

      - name: Pack repository
        run: |
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' \
            -czf ../codem-src.tar.gz .
          mv ../codem-src.tar.gz .

      - name: Copy tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "codem-src.tar.gz"
          strip_components: 0
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Unpack source on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR
          script: |
            set -e
            mkdir -p ${{ env.APP_DIR }}
            cd ${{ env.APP_DIR }}
            tar -xzf codem-src.tar.gz
            rm -f codem-src.tar.gz

      - name: Build, deploy, health-check, rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,IMAGE_NAME,APP_DIR,CONTAINER_NAME,APP_PORT,TASK_NAME,SITE_DOMAIN
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            PREV_TAG=$(docker inspect --format='{{index .Config.Labels "deploy.tag"}}' ${CONTAINER_NAME} 2>/dev/null || echo "")
            echo "previous tag: ${PREV_TAG:-none}"

            docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
            docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest

            IMAGE_TAG=${IMAGE_TAG} \
            IMAGE_NAME=${IMAGE_NAME} \
            CONTAINER_NAME=${CONTAINER_NAME} \
            APP_PORT=${APP_PORT} \
            docker compose up -d --remove-orphans

            echo "waiting for app health check..."
            ok=0
            for i in $(seq 1 10); do
              if docker compose exec -T app wget -qO- http://127.0.0.1:${APP_PORT}/healthz 2>/dev/null | grep -q ok; then
                ok=1; break
              fi
              sleep 3
            done

            if [ "$ok" = "1" ]; then
              docker update --label-add deploy.tag=${IMAGE_TAG} ${CONTAINER_NAME} 2>/dev/null || true
              echo "deploy succeeded: ${IMAGE_TAG}"

              # 注册 Caddy 站点（幂等覆盖），接入共享 Caddy 统一对外
              cat > /opt/caddy/sites/${TASK_NAME}.caddy <<EOF
            ${SITE_DOMAIN} {
            	reverse_proxy ${CONTAINER_NAME}:${APP_PORT}
            }
            EOF
              docker exec shared-caddy caddy reload --config /etc/caddy/Caddyfile --force 2>&1 || \
                docker exec shared-caddy caddy reload --config /etc/caddy/Caddyfile 2>&1 || true
              echo "site registered: https://${SITE_DOMAIN}"

              docker image prune -f
            else
              echo "health check FAILED, rolling back..."
              if [ -n "$PREV_TAG" ]; then
                IMAGE_TAG=${PREV_TAG} \
                IMAGE_NAME=${IMAGE_NAME} \
                CONTAINER_NAME=${CONTAINER_NAME} \
                APP_PORT=${APP_PORT} \
                docker compose up -d
                echo "rolled back to ${PREV_TAG}"
              else
                docker compose down
                echo "no previous version, service stopped"
              fi
              exit 1
            fi

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const domain = process.env.SITE_DOMAIN;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ 部署成功\n\n- 提交: ${sha}\n- 服务: https://${domain}\n- 健康检查: https://${domain}/healthz\n- 时间: ${new Date().toISOString()}`
            });
        env:
          SITE_DOMAIN: ${{ env.SITE_DOMAIN }}

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `❌ 部署失败\n\n- 提交: ${sha}\n- 日志: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- 时间: ${new Date().toISOString()}`
            });
