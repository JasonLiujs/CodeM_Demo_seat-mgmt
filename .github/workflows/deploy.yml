name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /opt/codem-demo
  IMAGE_NAME: codem-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node tests
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''

      - name: Python tests
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: hashFiles('requirements.txt') != ''
      - run: pytest
        if: hashFiles('requirements.txt') != ''

      - name: Docker build check
        run: docker build -t ${{ env.IMAGE_NAME }}:ci-check .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "Dockerfile,docker-compose.yml,package.json,server.js"
          strip_components: 0
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Build, deploy, health-check, rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            PREV_TAG=$(docker inspect --format='{{index .Config.Labels "deploy.tag"}}' ${IMAGE_NAME}-current 2>/dev/null || echo "")
            echo "previous tag: ${PREV_TAG:-none}"

            docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
            docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest

            IMAGE_TAG=${IMAGE_TAG} docker compose up -d --remove-orphans

            echo "waiting for health check..."
            ok=0
            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:8080/healthz > /dev/null; then
                ok=1; break
              fi
              sleep 3
            done

            if [ "$ok" = "1" ]; then
              docker update --label-add deploy.tag=${IMAGE_TAG} $(docker compose ps -q app) 2>/dev/null || true
              echo "deploy succeeded: ${IMAGE_TAG}"
              docker image prune -f
            else
              echo "health check FAILED, rolling back..."
              if [ -n "$PREV_TAG" ]; then
                IMAGE_TAG=${PREV_TAG} docker compose up -d
                echo "rolled back to ${PREV_TAG}"
              else
                docker compose down
                echo "no previous version, service stopped"
              fi
              exit 1
            fi
