name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /opt/codem-demo
  IMAGE_NAME: codem-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node tests
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
        if: hashFiles('package.json') != ''
      - run: npm run build
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''

      - name: Python tests
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: hashFiles('requirements.txt') != ''
      - run: pytest
        if: hashFiles('requirements.txt') != ''

      - name: Docker build check
        run: docker build -t ${{ env.IMAGE_NAME }}:ci-check .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pack repository
        run: |
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' \
            -czf ../codem-demo-src.tar.gz .
          mv ../codem-demo-src.tar.gz .

      - name: Copy tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "codem-demo-src.tar.gz"
          strip_components: 0
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Unpack source on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            tar -xzf codem-demo-src.tar.gz
            rm -f codem-demo-src.tar.gz
            rm -rf github

      - name: Build, deploy, health-check, rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,IMAGE_NAME,APP_DIR
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            PREV_TAG=$(docker inspect --format='{{index .Config.Labels "deploy.tag"}}' ${IMAGE_NAME}-current 2>/dev/null || echo "")
            echo "previous tag: ${PREV_TAG:-none}"

            docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
            docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest

            IMAGE_TAG=${IMAGE_TAG} docker compose up -d --remove-orphans

            echo "waiting for app health check..."
            ok=0
            for i in $(seq 1 10); do
              if docker compose exec -T app wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null | grep -q ok; then
                ok=1; break
              fi
              sleep 3
            done

            if [ "$ok" = "1" ]; then
              docker update --label-add deploy.tag=${IMAGE_TAG} $(docker compose ps -q app) 2>/dev/null || true
              echo "deploy succeeded: ${IMAGE_TAG}"
              docker image prune -f
            else
              echo "health check FAILED, rolling back..."
              if [ -n "$PREV_TAG" ]; then
                IMAGE_TAG=${PREV_TAG} docker compose up -d
                echo "rolled back to ${PREV_TAG}"
              else
                docker compose down
                echo "no previous version, service stopped"
              fi
              exit 1
            fi

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ 部署成功\n\n- 提交: ${sha}\n- 服务: https://www.meegodemo.com\n- 健康检查: https://www.meegodemo.com/healthz\n- 时间: ${new Date().toISOString()}`
            });

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `❌ 部署失败\n\n- 提交: ${sha}\n- 日志: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- 时间: ${new Date().toISOString()}`
            });
