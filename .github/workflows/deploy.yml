name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  TASK_NAME: ${{ vars.TASK_NAME }}
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
  APP_PORT: ${{ vars.APP_PORT || '8080' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Test Node.js project
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm run build --if-present
          npm test --if-present

      - name: Install Python
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Test Python project
        if: hashFiles('requirements.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          if [[ -d tests ]] || compgen -G 'test_*.py' >/dev/null; then pytest; fi

      - name: Validate deployment contract
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f docker-compose.yml
          docker compose config >/dev/null
          docker build --tag "codem-ci-check:${GITHUB_SHA}" .

  deploy:
    name: Deploy and verify HTTPS
    if: github.event_name != 'pull_request' && github.repository != 'JasonLiujs/CodeM_Template'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ vars.TASK_NAME || 'production' }}
      url: https://${{ vars.SITE_DOMAIN }}
    env:
      APP_DIR: /opt/apps/${{ vars.TASK_NAME }}
      IMAGE_NAME: codem-${{ vars.TASK_NAME }}
      CONTAINER_NAME: codem-${{ vars.TASK_NAME }}-app
      UPLOAD_DIR: /tmp/codem-upload-${{ github.run_id }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Preflight deployment configuration
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in TASK_NAME SITE_DOMAIN APP_PORT SERVER_HOST SERVER_USER SSH_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required deployment setting is missing: ${name}"
              exit 1
            fi
          done
          [[ "$TASK_NAME" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          [[ "$SITE_DOMAIN" == "${TASK_NAME}.meegodemo.com" ]]
          [[ "$APP_PORT" =~ ^[0-9]{2,5}$ ]]

      - name: Pack immutable release
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./codem-src.tar.gz' \
            -czf codem-src.tar.gz .

      - name: Upload release to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: codem-src.tar.gz
          target: ${{ env.UPLOAD_DIR }}
          overwrite: true

      - name: Activate release and register domain
        uses: appleboy/ssh-action@v1.2.5
        env:
          TASK_NAME: ${{ env.TASK_NAME }}
          SITE_DOMAIN: ${{ env.SITE_DOMAIN }}
          APP_PORT: ${{ env.APP_PORT }}
          APP_DIR: ${{ env.APP_DIR }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          UPLOAD_DIR: ${{ env.UPLOAD_DIR }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TASK_NAME,SITE_DOMAIN,APP_PORT,APP_DIR,IMAGE_NAME,CONTAINER_NAME,UPLOAD_DIR,IMAGE_TAG,GITHUB_RUN_ID
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            umask 077

            [[ "$TASK_NAME" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
            [[ "$SITE_DOMAIN" == "${TASK_NAME}.meegodemo.com" ]]
            [[ "$APP_PORT" =~ ^[0-9]{2,5}$ ]]

            RELEASE_DIR="${APP_DIR}/releases/${IMAGE_TAG}"
            PREV_RELEASE="$(readlink -f "${APP_DIR}/current" 2>/dev/null || true)"
            PREV_IMAGE="$(cat "${APP_DIR}/.last-successful-image" 2>/dev/null || true)"
            COMPOSE_PROJECT="codem-${TASK_NAME}"

            docker network inspect caddy-net >/dev/null
            docker inspect shared-caddy >/dev/null
            mkdir -p "$RELEASE_DIR"
            tar -xzf "${UPLOAD_DIR}/codem-src.tar.gz" -C "$RELEASE_DIR"
            rm -f "${UPLOAD_DIR}/codem-src.tar.gz"
            test -f "${RELEASE_DIR}/Dockerfile"
            test -f "${RELEASE_DIR}/docker-compose.yml"

            cd "$RELEASE_DIR"
            docker build --tag "${IMAGE_NAME}:${IMAGE_TAG}" .
            IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" \
              CONTAINER_NAME="$CONTAINER_NAME" APP_PORT="$APP_PORT" \
              docker compose --project-name "$COMPOSE_PROJECT" up -d --remove-orphans

            healthy=0
            for attempt in $(seq 1 30); do
              if docker exec "$CONTAINER_NAME" \
                wget -qO- "http://127.0.0.1:${APP_PORT}/healthz" 2>/dev/null | grep -q 'ok'; then
                healthy=1
                break
              fi
              sleep 3
            done

            if [[ "$healthy" != 1 ]]; then
              docker logs --tail 200 "$CONTAINER_NAME" 2>&1 || true
              if [[ -n "$PREV_RELEASE" && -n "$PREV_IMAGE" && -f "$PREV_RELEASE/docker-compose.yml" ]]; then
                PREV_IMAGE_NAME="${PREV_IMAGE%:*}"
                PREV_IMAGE_TAG="${PREV_IMAGE##*:}"
                IMAGE_NAME="$PREV_IMAGE_NAME" IMAGE_TAG="$PREV_IMAGE_TAG" \
                  CONTAINER_NAME="$CONTAINER_NAME" APP_PORT="$APP_PORT" \
                  docker compose --project-name "$COMPOSE_PROJECT" \
                    --file "$PREV_RELEASE/docker-compose.yml" up -d --remove-orphans
                echo "Rolled back to ${PREV_IMAGE}"
              else
                docker compose --project-name "$COMPOSE_PROJECT" down || true
              fi
              exit 1
            fi

            ln -sfn "$RELEASE_DIR" "${APP_DIR}/current"
            printf '%s\n' "${IMAGE_NAME}:${IMAGE_TAG}" > "${APP_DIR}/.last-successful-image"

            SITE_FILE="/opt/caddy/sites/${TASK_NAME}.caddy"
            SITE_TMP="${SITE_FILE}.tmp.${GITHUB_RUN_ID}"
            SITE_BACKUP="${SITE_FILE}.bak.${GITHUB_RUN_ID}"
            if [[ -f "$SITE_FILE" ]]; then cp "$SITE_FILE" "$SITE_BACKUP"; fi
            cat > "$SITE_TMP" <<EOF
            ${SITE_DOMAIN} {
                encode zstd gzip
                reverse_proxy ${CONTAINER_NAME}:${APP_PORT}
            }
            EOF
            mv "$SITE_TMP" "$SITE_FILE"

            if ! docker exec shared-caddy caddy validate --config /etc/caddy/Caddyfile; then
              if [[ -f "$SITE_BACKUP" ]]; then mv "$SITE_BACKUP" "$SITE_FILE"; else rm -f "$SITE_FILE"; fi
              exit 1
            fi
            if ! docker exec shared-caddy caddy reload --config /etc/caddy/Caddyfile --force; then
              if [[ -f "$SITE_BACKUP" ]]; then mv "$SITE_BACKUP" "$SITE_FILE"; else rm -f "$SITE_FILE"; fi
              docker exec shared-caddy caddy reload --config /etc/caddy/Caddyfile --force || true
              exit 1
            fi
            rm -f "$SITE_BACKUP"

      - name: Verify public HTTPS release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://${SITE_DOMAIN}/healthz" | grep -q 'ok'; then
              echo "Deployment verified: https://${SITE_DOMAIN}"
              {
                echo '## Deployment verified'
                echo
                echo "- URL: https://${SITE_DOMAIN}"
                echo "- Commit: ${GITHUB_SHA}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public HTTPS health check failed: https://${SITE_DOMAIN}/healthz"
          exit 1
