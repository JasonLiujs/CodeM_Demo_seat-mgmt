services:
  app:
    image: ${IMAGE_NAME:-codem-template}:${IMAGE_TAG:-latest}
    build: .
    container_name: ${CONTAINER_NAME:-codem-template-app}
    restart: unless-stopped
    environment:
      PORT: ${APP_PORT:-8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${APP_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
    name: caddy-net
